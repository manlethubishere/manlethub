<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANLET</title>

<style>
body{margin:0;font-family:Arial;background:#fff;color:#000}
#splash{position:fixed;width:100%;height:100%;background:#fff;display:flex;justify-content:center;align-items:center;z-index:999;}
#logo{width:120px;animation:zoom 2s ease;}
@keyframes zoom{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1)}}

.header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#000;color:#fff}
.sidebar{position:fixed;left:-220px;top:0;width:220px;height:100%;background:#000;color:#fff;transition:.3s}
.sidebar div{padding:14px;border-bottom:1px solid #333;cursor:pointer}

.search{width:90%;margin:10px;padding:10px;border:1px solid #ccc}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:10px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.card img{width:100%;height:130px;object-fit:contain}

.detail-img{width:100%;height:250px;object-fit:contain}
.price{text-decoration:line-through;color:gray}

button{width:100%;padding:10px;margin-top:10px;background:#000;color:#fff;border:none}

.page{display:none}.active{display:block}
.back{padding:10px;font-weight:bold;cursor:pointer}
.cart-item{border-bottom:1px solid #ddd;padding:10px}
</style>
</head>

<body>

<div id="splash"><img id="logo" src="logo.png"></div>

<div class="sidebar" id="sidebar">
<div onclick="goHome()">Home</div>
<div onclick="openCategory('beauty')">Beauty</div>
<div onclick="openCategory('perfume')">Perfume</div>
<div onclick="openCategory('wholesale')">Wholesale</div>
</div>

<div class="header">
<div onclick="toggleMenu()">☰</div>
<b>MANLET</b>
<div onclick="openCart()">🛒</div>
</div>

<div id="home" class="page active">
<input class="search" placeholder="Search products..." oninput="search(this.value)">
<div class="products" id="homeProducts"></div>
</div>

<div id="categoryPage" class="page">
<div class="back" onclick="goBack()">⬅ Back</div>
<div class="products" id="categoryProducts"></div>
</div>

<div id="detailPage" class="page">
<div class="back" onclick="goBack()">⬅ Back</div>
<div id="detailBox"></div>
</div>

<div id="cartPage" class="page">
<div class="back" onclick="goBack()">⬅ Back</div>
<input id="name" placeholder="Name" class="search">
<input id="address" placeholder="Address" class="search">
<div id="cartItems"></div>
<h3 id="total"></h3>
<button onclick="checkout()">Buy Now</button>
</div>

<script>

setTimeout(()=>splash.style.display="none",2000)

let cart=[]

function show(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));p.classList.add("active")}
function navigate(n,p){history.pushState({page:n},"");show(p)}
window.onpopstate=e=>{if(e.state){let p=e.state.page;p=="home"?show(home):p=="category"?show(categoryPage):p=="detail"?show(detailPage):show(cartPage)}else show(home)}
function goBack(){history.back()}

function toggleMenu(){sidebar.style.left=sidebar.style.left=="0px"?"-220px":"0px"}
function goHome(){toggleMenu();navigate("home",home)}

const data=[

// ✅ NEW BEAUTY ONLY
{name:"Dabur gulabari face cleanser",cat:"beauty",mrp:99,price:80,qty:"100ml",desc:"Rose cleanser.",img:"gulabari.jpg"},
{name:"Dove daily shine shampoo",cat:"beauty",mrp:246,price:233,qty:"180ml",desc:"Smooth shampoo.",img:"dove-shampoo.jpg"},
{name:"Parachute Body lotion",cat:"beauty",mrp:425,price:297,qty:"400ml",desc:"Moisture lotion.",img:"parachute-lotion.jpg"},
{name:"Parachute jasmine hair oil",cat:"beauty",mrp:425,price:318,qty:"500ml",desc:"Hair oil.",img:"para-oil.jpg"},
{name:"Nihar hair oil",cat:"beauty",mrp:227,price:192,qty:"550ml",desc:"Hair oil.",img:"nihar.jpg"},
{name:"Head & shoulder shampoo(with oxygenated charcol)",cat:"beauty",mrp:450,price:315,qty:"340ml",desc:"Anti dandruff.",img:"hs.jpg"},
{name:"Vaseline deep moisture body lotion",cat:"beauty",mrp:515,price:334,qty:"400ml",desc:"Moisture.",img:"vaseline.jpg"},
{name:"Dabur amla hair oil",cat:"beauty",mrp:300,price:255,qty:"550ml",desc:"Hair oil.",img:"amla.jpg"},
{name:"Mama earth ubtan facewash",cat:"beauty",mrp:269,price:242,qty:"100ml",desc:"Facewash.",img:"ubtan.jpg"},
{name:"Plum green tea facewash",cat:"beauty",mrp:199,price:190,qty:"50ml",desc:"Facewash.",img:"plum-green.jpg"},
{name:"Plum niacinamide facewash",cat:"beauty",mrp:199,price:190,qty:"50ml",desc:"Facewash.",img:"plum-niacin.jpg"},
{name:"Lotus vitamin c body lotion",cat:"beauty",mrp:625,price:437,qty:"560ml",desc:"Body lotion.",img:"lotus-c.jpg"},
{name:"Meghadoot neem alovera facewash",cat:"beauty",mrp:80,price:70,qty:"60ml",desc:"Facewash.",img:"megha.jpg"},
{name:"Mamaearth rice dewy facewash",cat:"beauty",mrp:99,price:80,qty:"20ml",desc:"Facewash.",img:"rice.jpg"},
{name:"Mama earth onion hair serum",cat:"beauty",mrp:299,price:154,qty:"100ml",desc:"Serum.",img:"onion.jpg"},
{name:"Streax hair serum 115ml",cat:"beauty",mrp:340,price:323,qty:"115ml",desc:"Serum.",img:"streax115.jpg"},
{name:"Dove conditioner",cat:"beauty",mrp:285,price:242,qty:"175ml",desc:"Conditioner.",img:"dove-cond.jpg"},
{name:"Ponds bright beauty facewash",cat:"beauty",mrp:475,price:380,qty:"200ml",desc:"Facewash.",img:"ponds.jpg"},
{name:"Lotus safe sun body lotion SPF",cat:"beauty",mrp:345,price:310,qty:"250ml",desc:"SPF lotion.",img:"lotus-spf.jpg"},
{name:"Earthcon vitamin c hair serum",cat:"beauty",mrp:149,price:126,qty:"100ml",desc:"Serum.",img:"earthcon.jpg"},
{name:"Elibliss vitamin c facewash",cat:"beauty",mrp:249,price:112,qty:"75ml",desc:"Facewash.",img:"elibliss.jpg"},
{name:"Mama Earth vitamin c face cream",cat:"beauty",mrp:249,price:224,qty:"80ml",desc:"Cream.",img:"cream.jpg"},
{name:"Rexona deodrant powder",cat:"beauty",mrp:95,price:76,qty:"25ml",desc:"Powder.",img:"rexona.jpg"},
{name:"Nivea natural glow underarm roller",cat:"beauty",mrp:250,price:200,qty:"50ml",desc:"Roller.",img:"nivea.jpg"},
{name:"Lotus white glow Gel creme",cat:"beauty",mrp:190,price:171,qty:"25gm",desc:"Gel.",img:"whiteglow.jpg"},
{name:"Savlon bathing soap",cat:"beauty",mrp:54,price:45,qty:"125gm",desc:"Soap.",img:"savlon.jpg"},
{name:"LOREAL PARIS hair serum",cat:"beauty",mrp:229,price:183,qty:"40ml",desc:"Serum.",img:"loreal.jpg"},
{name:"Garnier bright complete booster serum",cat:"beauty",mrp:619,price:557,qty:"30ml",desc:"Serum.",img:"garnier.jpg"},
{name:"Lotus safe sun suncreen spf 50",cat:"beauty",mrp:240,price:204,qty:"30gm",desc:"Sunscreen.",img:"spf50.jpg"},
{name:"Garnier bright complete vitamin c serum/Cream",cat:"beauty",mrp:249,price:224,qty:"45gm",desc:"Cream.",img:"garnier2.jpg"},

// PERFUME NEW ONLY
{name:"FOGG ABSOLUTE",cat:"perfume",mrp:299,price:254,qty:"150ml",desc:"Perfume.",img:"fogg.jpg"},
{name:"AXE MYSTERIOUS",cat:"perfume",mrp:399,price:280,qty:"200ml",desc:"Perfume.",img:"axe-mys.jpg"},
{name:"AXE INTENSE",cat:"perfume",mrp:399,price:280,qty:"200ml",desc:"Perfume.",img:"axe-int.jpg"}

]

function loadHome(){homeProducts.innerHTML="";data.forEach(p=>homeProducts.innerHTML+=card(p))}
loadHome()

function card(p){
return `<div class="card" onclick="openDetail('${p.name}')">
<img src="${p.img}" onerror="this.src='logo.png'">
<h4>${p.name}</h4>
<p>${p.qty}</p>
<p class="price">₹${p.mrp}</p>
<p>₹${p.price}</p>
</div>`
}

function search(q){
homeProducts.innerHTML=""
data.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()))
.forEach(p=>homeProducts.innerHTML+=card(p))
}

function openCategory(cat){
toggleMenu()
navigate("category",categoryPage)
let list=data.filter(p=>p.cat==cat)
categoryProducts.innerHTML=""
list.forEach(p=>categoryProducts.innerHTML+=card(p))
}

function openDetail(name){
navigate("detail",detailPage)
let p=data.find(x=>x.name==name)

detailBox.innerHTML=`
<img src="${p.img}" class="detail-img">
<h2>${p.name}</h2>
<p>${p.desc}</p>
<p class="price">₹${p.mrp}</p>
<h3>₹${p.price}</h3>
<p><b>Size:</b> ${p.qty}</p>

<button onclick="buyNow('${p.name}',${p.price})">Buy Now</button>
<button onclick="addCart('${p.name}')">Add to Cart</button>
`
}

function addCart(name){
let item=cart.find(x=>x.name==name)
if(item)item.qty++
else cart.push({name,qty:1})
alert("Added to cart")
}

function openCart(){
navigate("cart",cartPage)
cartItems.innerHTML=""
let total=0

cart.forEach(p=>{
let d=data.find(x=>x.name==p.name)
let sub=d.price*p.qty
total+=sub
cartItems.innerHTML+=`<div class="cart-item">${p.name} x${p.qty} = ₹${sub}</div>`
})

total.innerText="Total ₹"+total
}

function checkout(){
let n=document.getElementById("name").value
let a=document.getElementById("address").value
if(!n||!a){alert("Enter details");return}

let msg="Order Details:\nName: "+n+"\nAddress: "+a+"\n\n"
let total=0

cart.forEach(p=>{
let d=data.find(x=>x.name==p.name)
let sub=d.price*p.qty
total+=sub
msg+=p.name+" x"+p.qty+" = ₹"+sub+"\n"
})

msg+="\nTotal: ₹"+total
window.open("https://wa.me/918638618446?text="+encodeURIComponent(msg))
}

function buyNow(name,price){
let n=prompt("Name")
let a=prompt("Address")
if(!n||!a)return

let msg=`Order Details:\nName: ${n}\nAddress: ${a}\n\n${name} - ₹${price}`
window.open("https://wa.me/918638618446?text="+encodeURIComponent(msg))
}

</script>

</body>
</html>
