<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff;color:#000;overflow-x:hidden}

/* ENTRY */
#entry{
position:fixed;inset:0;background:#fff;display:flex;
align-items:center;justify-content:center;z-index:9999
}
#entry img{width:120px;animation:zoom 1.4s ease}
@keyframes zoom{
0%{transform:scale(.6);opacity:0}
60%{transform:scale(1.15)}
100%{transform:scale(1);opacity:1}
}

/* HEADER */
header{
position:sticky;top:0;background:#000;color:#fff;
padding:12px;text-align:center;z-index:10
}
.menu{position:absolute;left:12px;top:12px;cursor:pointer}
.cartBtn{position:absolute;right:12px;top:12px;cursor:pointer}

/* SIDEBAR */
.sidebar{
position:fixed;left:-230px;top:0;width:230px;height:100%;
background:#000;color:#fff;transition:.25s;z-index:20
}
.sidebar.show{left:0}
.sidebar .item{padding:14px;border-bottom:1px solid #333;cursor:pointer}

/* MAIN */
.container{max-width:520px;margin:auto;padding:10px}

/* PRODUCT */
.product{border:1px solid #ddd;margin:10px 0;padding:10px;cursor:pointer}
.product img{width:100%;height:150px;object-fit:contain;background:#fff}
h3{margin:6px 0}
.price{font-weight:bold}

/* UI */
button{width:100%;padding:10px;margin-top:6px;border:none;background:#000;color:#fff}
input{width:100%;padding:10px;margin:6px 0}
.back{margin:10px 0;font-weight:bold;cursor:pointer}
.row{display:flex;gap:8px}
.badge{font-size:12px;color:#666}
</style>
</head>

// ===== NAV =====
function toggleMenu(){ sidebar.classList.toggle('show') }
function closeMenu(){ sidebar.classList.remove('show') }

function goHome(){
currentList=[...data]
currentView='list'
renderList(currentList)
closeMenu()
pushState('list')
}

function openCategory(cat){
currentList=data.filter(p=>p.cat===cat)
currentView='list'
renderList(currentList)
closeMenu()
pushState('list')
}

// ===== RENDER LIST =====
function renderList(list){
let html=`<input placeholder="Search..." oninput="search(this.value)">`
list.forEach((p,i)=>{
html+=`
<div class="product" onclick="viewProduct(${i})">
<img src="${p.img}" onerror="this.src='logo.png'">
<h3>${p.name}</h3>
<div class="badge">${p.qty||''}</div>
<div class="price">₹${p.price}</div>
</div>`
})
app.innerHTML=html
}

// ===== VIEW PRODUCT =====
function viewProduct(i){
const p = currentList[i]
currentView='product'
app.innerHTML=`
<div class="back" onclick="goBack()">← Back</div>
<img src="${p.img}" style="width:100%;height:220px;object-fit:contain">
<h2>${p.name}</h2>
<p>${p.qty||''}</p>
<p class="price">₹${p.price}</p>
<button onclick='buyNow(${JSON.stringify(p)})'>Buy Now</button>
<button onclick='addToCart(${JSON.stringify(p)})'>Add to Cart</button>
`
pushState('product')
}

// ===== CART =====
function addToCart(p){
cart.push(p)
alert('Added to cart')
}

function openCart(){
currentView='cart'
let html=`<div class="back" onclick="goBack()">← Back</div><h2>Cart</h2>`
if(cart.length===0){
html+=`<p>Cart empty</p>`
}else{
cart.forEach((p,idx)=>{
html+=`<div class="row"><div style="flex:1">${p.name}</div><div>₹${p.price}</div></div>`
})
html+=`<button onclick="checkout()">Checkout</button>`
}
app.innerHTML=html
pushState('cart')
}

// ===== CHECKOUT =====
function checkout(){
currentView='checkout'
app.innerHTML=`
<div class="back" onclick="goBack()">← Back</div>
<h2>Enter Details</h2>
<input id="name" placeholder="Your Name">
<input id="address" placeholder="Your Address">
<button onclick="placeOrder()">Place Order</button>
`
pushState('checkout')
}

function placeOrder(){
const n = document.getElementById('name').value || ''
const a = document.getElementById('address').value || ''
let msg="Order:%0A"
cart.forEach(p=> msg += p.name + "%0A")
msg += `Name: ${n}%0AAddress: ${a}`
window.open(`https://wa.me/918638618446?text=${msg}`)
}

// ===== BUY NOW (single item) =====
function buyNow(p){
currentView='checkout'
app.innerHTML=`
<div class="back" onclick="goBack()">← Back</div>
<h2>${p.name}</h2>
<input id="name" placeholder="Your Name">
<input id="address" placeholder="Your Address">
<button onclick='placeSingle(${JSON.stringify(p)})'>Place Order</button>
`
pushState('checkout')
}

function placeSingle(p){
const n = document.getElementById('name').value || ''
const a = document.getElementById('address').value || ''
let msg=`Order:%0A${p.name}%0AName: ${n}%0AAddress: ${a}`
window.open(`https://wa.me/918638618446?text=${msg}`)
}

// ===== SEARCH =====
function search(q){
q = q.toLowerCase()
const list = data.filter(p=>p.name.toLowerCase().includes(q))
currentList = list
renderList(list)
}

// ===== HISTORY =====
function pushState(page){
history.pushState({page},'')
}

function goBack(){ history.back() }

window.onpopstate = ()=>{
// always return to last list (home/category/search)
renderList(currentList.length ? currentList : data)
currentView='list'
}

// ===== INIT =====
goHome()
</script>
