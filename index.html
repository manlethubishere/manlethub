margin:0;

/* ENTRY */
#entry{
position:fixed;
width:100%;
height:100%;
background:#fff;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
#entry img{
width:120px;
animation:zoom 1.5s ease;
}
@keyframes zoom{
0%{transform:scale(0.5);opacity:0}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

/* HEADER */
header{
background:#000;
color:#fff;
padding:12px;
text-align:center;
position:sticky;
top:0;
}
.menu{position:absolute;left:15px;top:12px;cursor:pointer}
.cart{position:absolute;right:15px;top:12px}

/* SIDEBAR */
.sidebar{
position:fixed;
left:-220px;
top:0;
width:220px;
height:100%;
background:#000;
color:#fff;
transition:.3s;
z-index:1000;
}
.sidebar div{
padding:14px;
border-bottom:1px solid #333;
cursor:pointer;
}
.sidebar.show{left:0}

/* MAIN */
.container{
max-width:500px;
margin:auto;
padding:10px;
}

/* PRODUCT */
.product{
border:1px solid #ddd;
margin:10px 0;
padding:10px;
cursor:pointer;
}
.product img{
width:100%;
height:140px;
object-fit:contain;
background:#fff;
}

/* BUTTON */
button{
width:100%;
padding:10px;
margin-top:5px;
background:#000;
color:#fff;
border:none;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin:10px 0;
}

/* BACK */
.back{
margin:10px 0;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

// NAV
function toggleMenu(){
sidebar.classList.toggle("show")
}
function goHome(){
render(data)
}
function openCategory(c){
render(data.filter(p=>p.cat==c))
toggleMenu()
}

// RENDER
function render(list){
let html=`<input placeholder="Search..." oninput="search(this.value)">`
list.forEach((p,i)=>{
html+=`
<div class="product" onclick="view(${i})">
<img src="${p.img}" onerror="this.src='logo.png'">
<h3>${p.name}</h3>
<p>${p.qty||""}</p>
<p>₹${p.price}</p>
</div>`
})
app.innerHTML=html
}

// VIEW
function view(i){
let p=data[i]
app.innerHTML=`
<div class="back" onclick="goBack()">← Back</div>
<img src="${p.img}" style="width:100%;object-fit:contain">
<h2>${p.name}</h2>
<p>${p.qty||""}</p>
<p>₹${p.price}</p>
<button onclick="buy('${p.name}')">Buy Now</button>
<button onclick="addCart('${p.name}')">Add to Cart</button>
`
history.pushState({page:"detail"},"")
}

// BACK
function goBack(){history.back()}
window.onpopstate=()=>goHome()

// SEARCH
function search(q){
q=q.toLowerCase()
render(data.filter(p=>p.name.toLowerCase().includes(q)))
}
