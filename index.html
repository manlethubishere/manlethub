margin:0;
padding:0;
box-sizing:border-box;

}

body{
background:#fff;
color:#000;
overflow-x:hidden;
}

/* ENTRY */
#entry{
position:fixed;
inset:0;
background:#fff;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

#entry img{
width:130px;
animation:myntra 1.7s ease;
}

@keyframes myntra{
0%{
opacity:0;
transform:scale(.5);
filter:drop-shadow(0 0 0px #00ff66);
}
50%{
opacity:1;
transform:scale(1.4);
filter:drop-shadow(0 0 35px #00ff66);
}
100%{
opacity:1;
transform:scale(1);
filter:drop-shadow(0 0 0px #00ff66);
}
}

/* HEADER */
header{
position:sticky;
top:0;
background:#fff;
padding:14px;
display:flex;
justify-content:center;
align-items:center;
border-bottom:1px solid #ddd;
z-index:999;
}

.logoText{
font-size:22px;
font-weight:bold;
}

.menuBtn{
position:absolute;
left:15px;
font-size:24px;
cursor:pointer;
}

.cartBtn{
position:absolute;
right:15px;
font-size:22px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:-260px;
top:0;
width:260px;
height:100%;
background:#fff;
box-shadow:0 0 15px rgba(0,0,0,.2);
transition:.3s;
z-index:9999;
padding-top:60px;
}

.sidebar.show{
left:0;
}

.sidebar div{
padding:18px;
border-bottom:1px solid #eee;
font-size:17px;
cursor:pointer;
font-weight:bold;
}

/* MAIN */
.container{
max-width:520px;
margin:auto;
padding:12px;
}

/* SEARCH */

width:100%;
padding:13px;
border:none;
background:#f3f3f3;
border-radius:10px;
margin-bottom:15px;
font-size:15px;
}

/* PRODUCT */
.product{
background:#fff;
border-radius:14px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
cursor:pointer;
}

.product img{
width:100%;
height:210px;
object-fit:contain;
background:#fff;
}

.productInfo{
padding:12px;
}

.productName{
font-size:16px;
font-weight:bold;
margin-bottom:5px;
}

.qty{
font-size:13px;
color:#666;
margin-bottom:8px;
}

.priceBox{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.mrp{
text-decoration:line-through;
color:#777;
font-size:14px;
}

.discount{
color:#00a63e;
font-weight:bold;
font-size:14px;
}

.sale{
font-size:22px;
font-weight:bold;
}

/* DETAIL */

width:100%;
height:320px;
object-fit:contain;
background:#fff;
}

.detail{
padding:10px;
}

.back{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
cursor:pointer;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.buy{
background:#000;
color:#fff;

.cart{
background:#00a63e;
color:#fff;
}

/* CART */

display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #eee;
}

/* FORM */

width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
margin-top:12px;
}

.checkoutBtn{
background:#000;
color:#fff;
margin-top:15px;
}

.empty{
text-align:center;
padding:40px;
color:#777;
font-size:18px;
}

/* HOME */
function goHome(){
currentList=[...data]
render(currentList)
closeSidebar()
history.pushState({page:"home"},"")
}

/* CATEGORY */
function openCategory(cat){
currentList=data.filter(p=>p.cat===cat)
render(currentList)
closeSidebar()
history.pushState({page:"category"},"")
}

/* SEARCH */
function search(q){
q=q.toLowerCase()
const filtered=currentList.filter(p=>
p.name.toLowerCase().includes(q)
)
render(filtered,false)
}

/* RENDER */
function render(list,showSearch=true){

let html=""

if(showSearch){
html+=`
<input 
class="search"
placeholder="Search products..."
oninput="search(this.value)"
>
`
}

list.forEach((p,i)=>{

html+=`
<div class="product" onclick="openProduct(${data.indexOf(p)})">

<img src="${p.img}" onerror="this.src='logo.png'">

<div class="productInfo">

<div class="productName">${p.name}</div>

<div class="qty">${p.qty}</div>

<div class="priceBox">

<div class="mrp">
₹${p.mrp}
</div>

<div class="discount">
${p.discount}
</div>

</div>

<div class="sale">
₹${p.price}
</div>

</div>

</div>
`

})

app.innerHTML=html

}

<br>

</button>

</div>
`

}

/* CART */

cart.push(data[i])

alert("Added To Cart")

}

function openCart(){

let html=`
<div class="back" onclick="history.back()">
← Back
</div>

<h2>Shopping Cart</h2>

<br>
`

if(cart.length===0){

html+=`
<div class="empty">
Cart Is Empty
</div>
`

}else{

cart.forEach((p,index)=>{

html+=`

<div class="cartItem">

<div>
${p.name}
<br>
₹${p.price}
</div>

<div>
${p.qty}
</div>

</div>

`

})

html+=`

<input 
class="input"
id="customerName"
placeholder="Enter Your Name"
>

<input 
class="input"
id="customerAddress"
placeholder="Enter Your Address"
>

<button class="btn checkoutBtn" onclick="checkout()">
Place Order On WhatsApp
</button>

`

}

app.innerHTML=html

history.pushState({page:"cart"},"")

}

/* CHECKOUT */
function checkout(){

const name=document.getElementById("customerName").value

const address=document.getElementById("customerAddress").value

let message=`🛒 MANLET ORDER %0A%0A`

cart.forEach((p,index)=>{

message+=`${index+1}. ${p.name} - ₹${p.price}%0A`

})

message+=`%0A👤 Name: ${name}%0A📍 Address: ${address}`

window.open(
`https://wa.me/918638618446?text=${message}`
)

}

/* BUY NOW */

const p=data[i]

app.innerHTML=`

>

class="input"
id="buyAddress"
placeholder="Enter Your Address"
>

<button class="btn buy" onclick="finalBuy(${i})">
Order On WhatsApp
</button>

`

history.pushState({page:"buy"},"")

}

function finalBuy(i){

const p=data[i]

const name=document.getElementById("buyName").value

const address=document.getElementById("buyAddress").value

const msg=`
🛒 MANLET ORDER

Product: ${p.name}
Price: ₹${p.price}

Name: ${name}
Address: ${address}
`

window.open(
`https://wa.me/918638618446?text=${encodeURIComponent(msg)}`
)

}
