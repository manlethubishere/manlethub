<style>

.menu{position:absolute;left:15px;top:15px;font-size:22px;cursor:pointer}
.cart{position:absolute;right:15px;top:15px}

.back{cursor:pointer;margin:10px 0;display:block}

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("show")
}

function goHome(){
render(data)
toggleMenu()
}

function openCategory(cat){
const filtered=data.filter(p=>p.cat===cat)
render(filtered)
toggleMenu()
}

function render(list){
let html=`<input placeholder="Search..." oninput="search(this.value)">`
list.forEach((p,i)=>{
html+=`
<div class="product" onclick="viewProduct(${i})">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
</div>`
})
document.getElementById("app").innerHTML=html
}

function viewProduct(i){
const p=data[i]
document.getElementById("app").innerHTML=`
<span class="back" onclick="goHome()">← Back</span>
<img src="${p.img}" style="width:100%;object-fit:contain">
<h2>${p.name}</h2>
<p>${p.qty}</p>
<p>₹${p.price}</p>
<button onclick="buyNow('${p.name}')">Buy Now</button>
<button onclick="addCart('${p.name}')">Add to Cart</button>
`
history.pushState({},"","")
}

window.onpopstate=()=>goHome()

function addCart(name){
cart.push(name)
alert("Added to cart")
}

function buyNow(name){
let n=prompt("Enter Name")
let a=prompt("Enter Address")
let msg=`Order: ${name}%0AName: ${n}%0AAddress: ${a}`
window.open(`https://wa.me/918638618446?text=${msg}`)
}

function search(q){
q=q.toLowerCase()
render(data.filter(p=>p.name.toLowerCase().includes(q)))
}

render(data)

</script>
