<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANLET</title>

<style>
body{margin:0;font-family:sans-serif;background:#fff;color:#000;overflow-x:hidden}

/* ENTRY ANIMATION */
#entry{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
#logo{
font-size:40px;
color:#fff;
animation:glow 1s ease-in-out infinite alternate;
}
@keyframes glow{
from{text-shadow:0 0 10px #fff}
to{text-shadow:0 0 25px #0f0}
}

/* HEADER */
header{
background:#000;color:#fff;
padding:15px;
text-align:center;
position:sticky;top:0
}
.menu{position:absolute;left:15px;top:15px;cursor:pointer}
.cart{position:absolute;right:15px;top:15px}

/* SIDEBAR */
.sidebar{
position:fixed;
left:-250px;
top:0;
width:250px;
height:100%;
background:#000;
color:#fff;
padding:20px;
transition:.3s;
z-index:999
}
.sidebar div{padding:10px;cursor:pointer}
.sidebar.show{left:0}

/* CONTENT */
.container{
padding:10px;
max-width:500px;
margin:auto;
}

.product{
border:1px solid #ddd;
margin:10px 0;
padding:10px;
cursor:pointer;
}

.product img{
width:100%;
height:auto;
object-fit:contain;
display:block;
margin:auto;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:5px;
border:none;
background:#000;
color:#fff;
cursor:pointer;
}

.back{margin:10px 0;cursor:pointer}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entry"><div id="logo">M</div></div>

<header>
<span class="menu" onclick="toggleMenu()">☰</span>
MANLET
<span class="cart">🛒</span>
</header>

<div class="sidebar" id="sidebar">
<div onclick="goHome()">Home</div>
<div onclick="openCategory('beauty')">Beauty</div>
<div onclick="openCategory('perfume')">Perfume</div>
<div onclick="openCategory('wholesale')">Wholesale</div>
</div>

<div class="container" id="app"></div>

<script>

// NAV
function toggleMenu(){
sidebar.classList.toggle("show")
}

function goHome(){
render(data)
}

function openCategory(c){
render(data.filter(p=>p.cat==c))
toggleMenu()
}

// RENDER
function render(list){
let html=`<input placeholder="Search..." oninput="search(this.value)">`
list.forEach((p,i)=>{
html+=`
<div class="product" onclick="view(${i})">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
</div>`
})
app.innerHTML=html
}

// VIEW
function view(i){
let p=data[i]
app.innerHTML=`
<div class="back" onclick="goHome()">← Back</div>
<img src="${p.img}" style="width:100%;object-fit:contain">
<h2>${p.name}</h2>
<p>${p.qty||""}</p>
<p>₹${p.price}</p>
<button onclick="buy('${p.name}')">Buy Now</button>
<button onclick="cartAdd('${p.name}')">Add to Cart</button>
`
history.pushState({},"","")
}

// BACK
window.onpopstate=()=>goHome()

// SEARCH
function search(q){
q=q.toLowerCase()
render(data.filter(p=>p.name.toLowerCase().includes(q)))
}

// CART
function cartAdd(n){
alert("Added to cart")
}

// BUY
function buy(n){
let name=prompt("Enter Name")
let add=prompt("Enter Address")
let msg=`Order: ${n}%0AName: ${name}%0AAddress: ${add}`
window.open(`https://wa.me/918638618446?text=${msg}`)
}

// INIT
render(data)

</script>

</body>
</html>
